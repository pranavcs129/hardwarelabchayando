   (s.tip?'<div class="tip">💡 '+s.tip+'</div>':'')+(st.w?'<div class="tip" style="color:#ff8a80">'+st.w+'</div>':'')+'<div class="nv"><button data-g="back" '+(gi?'':'disabled')+'>‹ Back</button><button class="p" data-g="next" '+(gi<gst.length-1?'':'disabled')+'>Next ›</button></div>')+
   '</div>':'');
}
gd.addEventListener('click',e=>{
  const b=e.target.closest('[data-g]');if(!b)return;const a=b.dataset.g;
  if(a==='tog')gopen=!gopen;else if(a==='x'){gdHide();return}

/* ---------- floating name tags on the board ---------- */
const bxl={};let bxRaf=0,bxSig='';
function bxTags(){
  const T=window.T;
  if(!gvis||!exp||!T||!T.cam||!T.panel){Object.values(bxl).forEach(d=>d.style.display='none');bxSig='';bxRaf=0;return}
  const M=T.panel().matrixWorld.elements,V=T.cam.matrixWorldInverse.elements,P=T.cam.projectionMatrix.elements,W=innerWidth,H=innerHeight;
  const sig=V.join(',')+P[0]+M.join(',')+innerWidth+exp.id;if(sig===bxSig){bxRaf=requestAnimationFrame(bxTags);return}bxSig=sig;
  const want=[];
  exp.ins.forEach((nm,i)=>want.push(['sw',i,nm,'s',nm]));
  exp.outs.forEach((nm,i)=>want.push(['led',i,nm,'o','LED '+nm]));
  const used=new Set();
  want.forEach(([ty,idx,nm,cl,tx])=>{
    const n=T.nodes.find(q=>q.r&&q.r[0]===ty&&q.r[1]===idx);const k=ty+idx;used.add(k);
    let d=bxl[k];if(!d){d=bxl[k]=document.createElement('div');document.body.appendChild(d)}
    d.className='bxl '+cl;d.textContent=tx;
    if(!n){d.style.display='none';return}
    const x=n.x,y=(n.y||0)+.03,z=n.z;
    const wx=M[0]*x+M[4]*y+M[8]*z+M[12],wy=M[1]*x+M[5]*y+M[9]*z+M[13],wz=M[2]*x+M[6]*y+M[10]*z+M[14];
    const vx=V[0]*wx+V[4]*wy+V[8]*wz+V[12],vy=V[1]*wx+V[5]*wy+V[9]*wz+V[13],vz=V[2]*wx+V[6]*wy+V[10]*wz+V[14];
    const cx=P[0]*vx+P[4]*vy+P[8]*vz+P[12],cy=P[1]*vx+P[5]*vy+P[9]*vz+P[13],cw=P[3]*vx+P[7]*vy+P[11]*vz+P[15];
    if(cw<=0){d.style.display='none';return}
    const sx=(cx/cw+1)/2*W,sy=(1-cy/cw)/2*H;
    d.style.display=(sx<-40||sx>W+40||sy<0||sy>H)?'none':'block';
    d.style.left=sx+'px';d.style.top=(sy-6)+'px'});
  Object.keys(bxl).forEach(k=>{if(!used.has(k))bxl[k].style.display='none'});
  bxRaf=requestAnimationFrame(bxTags);
}
const bxStart=()=>{bxSig='';if(!bxRaf)bxRaf=requestAnimationFrame(bxTags)};
function gdHide(){gvis=false;gst=[];gd.style.display='none'}
function gdStart(){gst=gbuild();gi=0;gopen=false;gverified=false;gprev=[];gsig='';gvis=true;bxStart();ctx?gdUpdate(ctx):gdRender(gst.map(()=>({ps:[],done:false})))}

/* ---------- wiring analysis ---------- */
function analyse(x){
  const {e,t,fl,to,fi,Ln,n}=x,out=[],drv={};
  const add=(k,v,l)=>{const c=e(k);(drv[c]??={v:new Set(),s:new Set()});drv[c].v.add(v);drv[c].s.add(l)};
  t('v5').forEach(c=>add(c.key,1,'+5V'));t('gnd').forEach(c=>add(c.key,0,'GND'));
  t('sw').forEach(c=>add(c.key,fl[c.r[1]]?1:0,'a switch'));
  t('q').forEach(c=>add(c.key,to?1:0,'the push button'));t('qn').forEach(c=>add(c.key,to?0:1,'the push button'));
  for(const k in drv){const d=drv[k];if(d.v.size>1){const s=[...d.s],pg=s.includes('+5V')&&s.includes('GND');
    out.push({short:1,title:pg?'⚡ Short circuit (+5V to GND)':'⚡ Two sources are fighting',
      msg:pg?'A wire connects +5V directly to GND. This would burn a real circuit.':s.join(' and ')+' are joined by a wire but are at different levels (0 and 1).',
      fix:pg?'Remove the wire between the +5V and GND points.':'Remove the wire that joins them.'})}}
  fi.forEach(c=>{
    const nm='IC '+(c.t==7411?'74LS11':'74'+String(c.t).slice(2)),n14=e(Ln(c,14)),n7=e(Ln(c,7)),a=drv[n14],b=drv[n7];
    const h14=a&&a.s.has('+5V'),g14=a&&a.s.has('GND'),h7=b&&b.s.has('+5V'),g7=b&&b.s.has('GND');
    if(n14===n7){out.push({title:nm+': power pins joined',msg:'Pin 14 (VCC) and pin 7 (GND) are connected to each other.',fix:'Separate them. Pin 14 goes to +5V, pin 7 to GND.'});return}
    if(g14&&h7){out.push({title:nm+': power is backwards',msg:'Pin 14 is on GND and pin 7 is on +5V.',fix:'Swap them: pin 14 to +5V, pin 7 to GND.'});return}
    if(!h14)out.push({title:nm+': no +5V power',msg:'Pin 14 (VCC) is not connected to +5V, so the chip stays off.',fix:'Wire pin 14 to a +5V point.'});
    if(!g7)out.push({title:nm+': no ground',msg:'Pin 7 (GND) is not connected to GND, so the chip stays off.',fix:'Wire pin 7 to a GND point.'});
    if(!h14||!g7)return;
    const IN={7402:[2,3,5,6,8,9,11,12],7404:[1,3,5,9,11,13],7410:[1,2,13,3,4,5,9,10,11],7411:[1,2,13,3,4,5,9,10,11],7474:[2,3,11,12]}[c.t]||[1,2,4,5,9,10,12,13];
    const GP={7400:[[[1,2],3],[[4,5],6],[[9,10],8],[[12,13],11]],7402:[[[2,3],1],[[5,6],4],[[8,9],10],[[11,12],13]],7404:[[[1],2],[[3],4],[[5],6],[[9],8],[[11],10],[[13],12]],7410:[[[1,2,13],12],[[3,4,5],6],[[9,10,11],8]]};
    GP[7408]=GP[7432]=GP[7486]=GP[7400];GP[7411]=GP[7410];
    const fl0=p=>n[e(Ln(c,p))]===undefined,wr=(window.T&&window.T.wires)||[],outUsed=o=>{const q=e(Ln(c,o));return wr.some(w=>e(w.a.key)===q||e(w.b.key)===q)};
    let f2=IN.filter(fl0);
    if(GP[c.t])f2=f2.filter(p=>{const g=GP[c.t].find(g=>g[0].includes(p));return !g||g[0].some(q=>!fl0(q))||outUsed(g[1])});
    if(f2.length&&!exp)out.push({title:nm+': input'+(f2.length>1?'s':'')+' not connected',msg:'Pin'+(f2.length>1?'s ':' ')+f2.join(', ')+(f2.length>1?' are':' is')+' left floating, so the gate reads a random level.',fix:'Wire them to a switch, +5V, GND or another gate output.'});
    for(const p in c.o){const v=c.o[p],net=e(Ln(c,+p)),d=drv[net];
      if(d&&[...d.v].some(z=>z!==v))out.push({title:nm+': output pin '+p+' forced',msg:'This output is wired to '+[...d.s].join(' / ')+', which pushes against it.',fix:'Disconnect pin '+p+' from that point. Outputs should only go to inputs or LEDs.'});
      else if(n[net]!==v)out.push({title:nm+': outputs clash on pin '+p,msg:'Two gate outputs are joined together and give different levels.',fix:'Remove the wire that joins the two outputs.'})}
  });
  return out;
}
function showIssues(is){popup('warn','⚠️',is.length>1?is.length+' wiring problems':'Wrong connection','Your circuit may not work. Here is what to fix:',
  is.map(i=>'<div class="it"><div class="h">'+i.title+'</div><div class="m">'+i.msg+'</div><div class="f"><b>Fix:</b> '+i.fix+'</div></div>').join(''))}

/* ---------- lab check: sweep every switch combination ---------- */
let busy=false;
function labCheck(x){
  const pinNets=new Set();x.fi.forEach(c=>{for(let p=1;p<=14;p++)pinNets.add(x.e(x.Ln(c,p)))});
  const uniq=a=>[...new Set(a)].sort((p,q)=>p-q);
  const sw=uniq(x.t('sw').filter(c=>pinNets.has(x.e(c.key))).map(c=>c.r[1]));
  const led=uniq(x.t('led').filter(c=>pinNets.has(x.e(c.key))).map(c=>c.r[1]));
  const probs=[];
  if(sw.length!==exp.ins.length)probs.push({title:'Input switches',msg:'This experiment needs <b>'+exp.ins.length+'</b> input switch'+(exp.ins.length>1?'es':'')+' wired to the ICs, but I found <b>'+sw.length+'</b>.',fix:sw.length<exp.ins.length?'Connect '+(exp.ins.length-sw.length)+' more switch'+(exp.ins.length-sw.length>1?'es':'')+' to the gate inputs.':'Disconnect the extra switch from the circuit.'});
  if(led.length<exp.outs.length)probs.push({title:'Output LEDs',msg:'This experiment needs <b>'+exp.outs.length+'</b> output LED'+(exp.outs.length>1?'s':'')+' ('+exp.outs.join(', ')+') wired to gate outputs, but I found <b>'+led.length+'</b>.',fix:'Connect a gate output pin to '+(exp.outs.length-led.length)+' more LED'+(exp.outs.length-led.length>1?'s':'')+'.'});
  if(probs.length)return {probs};
  busy=true;const saved=sw.map(i=>x.fl[i]),rows=[];
  try{for(let m=0;m<(1<<sw.length);m++){const bits=sw.map((i,k)=>{const b=(m>>(sw.length-1-k))&1;x.fl[i]=b;return b});x.hn();
      rows.push({i:bits,e:exp.fn(bits),g:led.slice(0,exp.outs.length).map(l=>x.io[l].visible?1:0)})}}
  finally{sw.forEach((i,k)=>x.fl[i]=saved[k]);x.hn();busy=false}
  return {rows};
}
function run(force){
  const x=ctx;if(!x)return;
  if(!x.Pn){return popup('info','ℹ️','Power is OFF',null,'<p>Turn the red rocker switch ON first.</p>')}
  const is=analyse(x);
  if(is.length){if(gvis&&exp&&!is.some(i=>i.short)&&!gstate(x).slice(0,-2).every(z=>z.done)){flash('Finish the wiring steps in the guide first');return}return showIssues(is)}
  if(!x.fi.length){if(force)popup('info','ℹ️','No IC on the board',null,'<p>Place the ICs for this experiment and wire them up.</p>');return}
  if(!exp){flash('✅ Wiring OK');return}
  const r=labCheck(x);
  if(r.probs){const sig=r.probs.map(p=>p.msg).join('|');if(force||sig!==labSig)popup('warn','⚠️',exp.name+': not complete yet','Almost there. Fix these first:',r.probs.map(p=>'<div class="it"><div class="h">'+p.title+'</div><div class="m">'+p.msg+'</div><div class="f"><b>Fix:</b> '+p.fix+'</div></div>').join(''));labSig=sig;return}
  const bad=r.rows.filter(w=>w.e.join()!==w.g.join()),sig='r'+r.rows.map(w=>w.g.join('')).join('.');
  gverified=!bad.length;setTimeout(()=>ctx&&gdUpdate(ctx),0);
  if(!bad.length){if(force||labSig!==sig){popup('ok','✅',exp.name+' verified','All '+r.rows.length+' truth-table rows are correct.',tbl(r.rows))}else flash('✅ '+exp.name+' correct');labSig=sig;return}
  const hints=[];
  const miss=exp.ics.filter(t=>!x.fi.some(c=>c.t===t));
  if(miss.length)hints.push('This experiment normally uses '+miss.map(t=>'<b>'+ICN[t]+'</b>').join(', ')+', which is not placed on the board.');
  if(r.rows.every(w=>w.e.every((v,k)=>v!==w.g[k])))hints.push('<b>Every output is inverted.</b> You probably used the opposite gate (for example NAND instead of AND, or NOR instead of OR), or an extra inverter.');
  else if(exp.outs.length>1&&r.rows.every(w=>w.e.every((v,k)=>v===w.g[exp.outs.length-1-k])))hints.push('<b>The LEDs look swapped.</b> Put '+exp.outs[0]+' on the lower-numbered LED and '+exp.outs[1]+' on the higher one.');
  else{const cols=exp.outs.map((o,k)=>r.rows.every(w=>w.e[k]===w.g[k])?null:o).filter(Boolean);hints.push('<b>'+cols.join(' and ')+'</b> '+(cols.length>1?'are':'is')+' wrong in '+bad.length+' of '+r.rows.length+' rows. Check the input pins feeding that gate and the output pin going to its LED.')}
  hints.push('Also check that no input is connected to the wrong switch, and that inputs go to input pins (not output pins).');
  popup('warn','❌',exp.name+': wrong output',bad.length+' of '+r.rows.length+' rows do not match the expected truth table.',tbl(r.rows)+hints.map(h=>'<div class="it"><div class="m">'+h+'</div></div>').join(''));
  labSig=sig;
}
function tbl(rows){
  return '<table><tr>'+exp.ins.map(i=>'<th>'+i+'</th>').join('')+exp.outs.map(o=>'<th>'+o+'<br>expected</th><th>'+o+'<br>yours</th>').join('')+'</tr>'+
   rows.map(w=>{const ok=w.e.join()===w.g.join();return '<tr class="'+(ok?'good':'bad')+'">'+w.i.map(b=>'<td>'+b+'</td>').join('')+exp.outs.map((o,k)=>'<td>'+w.e[k]+'</td><td class="g">'+w.g[k]+(w.e[k]===w.g[k]?'':' ✗')+'</td>').join('')+'</tr>'}).join('')+'</table>'}

/* ---------- hook called from the simulator ---------- */
let ctx=null,prevSnap='',lastShort='',cur=[];
chip.onclick=()=>cur.length&&showIssues(cur);
window.__chk=function(x){
  if(busy)return;
  ctx=x;gdUpdate(x);
  if(!x.Pn){cur=[];chip.style.display='none';prevSnap='off';lastShort='';return}
  const snap=JSON.stringify([x.fl,x.to]),action=(prevSnap!==''&&prevSnap!==snap)||prevSnap==='off';
  prevSnap=snap;
  const is=analyse(x);cur=is;
  chip.style.display=is.length?'block':'none';chip.textContent='⚠ '+is.length+' problem'+(is.length>1?'s':'')+' · tap';
  const sig=is.filter(i=>i.short).map(i=>i.title+i.msg).join('|');
  const newShort=sig&&sig!==lastShort;lastShort=sig;
  if(newShort)return showIssues(is);
  if(action)setTimeout(()=>run(false),0);
};

          '<div class="it" style="border-left-color:#78909c"><div class="h" style="color:#b0bec5">🧹 Clear All</div><div class="m">Clears all wires and chips from the breadboard to start a new circuit from scratch.</div></div>' +
          '<div class="it" style="border-left-color:#66bb6a"><div class="h" style="color:#a5d6a7">🧪 Guided Lab Mode (🧪 Lab)</div><div class="m">Tap the blue <b>Lab</b> chip at top-left to select guided experiments (such as SOP using NAND or POS using NOR). Follow step-by-step pin instructions and verify your circuit against truth tables!</div></div>',
